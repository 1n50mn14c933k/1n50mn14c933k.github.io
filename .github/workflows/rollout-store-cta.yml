name: Roll out Microsoft Store CTA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rollout-store-cta.yml

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply approved Microsoft Store CTA everywhere
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          STORE_URL = "https://apps.microsoft.com/detail/9p0x091t7mv4?ocid=webpdpshare"

          languages = ["en", "fa", "de", "es", "it", "fr", "pt", "ja", "zh", "hi", "ru", "ar"]
          homepage_paths = [Path(f"{lang}/index.html") for lang in languages]
          media_paths = [Path(f"{lang}/Media_Kolfat/index.html") for lang in languages]
          utility_paths = [Path("privacy/index.html"), Path("support/index.html")]
          targets = homepage_paths + media_paths + utility_paths

          css = r'''
          .store-btn{
            display:flex;align-items:center;justify-content:flex-start;gap:16px;
            width:350px;min-height:68px;margin-top:12px;padding:10px 18px;
            border:1px solid rgba(255,255,255,.95);border-radius:10px;
            background:#fff;color:#050505;text-decoration:none;transition:.22s;
            box-shadow:0 10px 30px rgba(0,0,0,.32)
          }
          .store-btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(0,0,0,.42);background:#f6f6f6;color:#050505}
          .store-icon{width:40px;height:40px;flex:0 0 40px;display:block}
          .store-copy{display:flex;flex-direction:column;justify-content:center;line-height:1.05;text-align:left;min-width:0}
          .store-copy small{font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin-bottom:5px;white-space:nowrap}
          .store-copy strong{font-size:1.12rem;letter-spacing:.01em;font-weight:700;white-space:nowrap}
          html[dir="rtl"] .store-btn{direction:ltr;margin-left:auto;margin-right:0}
          @media(max-width:640px){
            .store-btn{width:min(350px,100%);min-height:64px;padding:9px 16px}
            .store-icon{width:36px;height:36px;flex-basis:36px}
            .store-copy small{font-size:.52rem}
            .store-copy strong{font-size:1rem}
          }
          '''

          button = f'''
          <a class="store-btn" href="{STORE_URL}" target="_blank" rel="noopener noreferrer" aria-label="Get MEDIA KOLFAT from the Microsoft Store">
            <svg class="store-icon" viewBox="0 0 44 44" aria-hidden="true">
              <rect x="2" y="2" width="18" height="18" fill="#f25022"/>
              <rect x="24" y="2" width="18" height="18" fill="#7fba00"/>
              <rect x="2" y="24" width="18" height="18" fill="#00a4ef"/>
              <rect x="24" y="24" width="18" height="18" fill="#ffb900"/>
            </svg>
            <span class="store-copy"><small>Get MEDIA KOLFAT from</small><strong>Microsoft Store</strong></span>
          </a>'''

          for path in targets:
            if not path.exists():
              raise SystemExit(f"Missing target page: {path}")

            html = path.read_text(encoding="utf-8")

            # Keep the already-approved root page untouched; every target receives the same CTA styling.
            if ".store-btn{" not in html and ".store-btn {" not in html:
              if "</style>" not in html:
                raise SystemExit(f"No style block found in {path}")
              html = html.replace("</style>", css + "\n</style>", 1)

            if 'class="store-btn"' not in html:
              if path in homepage_paths:
                # Place directly under the primary GET STARTED / localized primary CTA.
                pattern = re.compile(r'(<a class="btn"[^>]*>.*?</a>)', re.S)
                html, n = pattern.subn(r'\1\n' + button, html, count=1)
                if n != 1:
                  raise SystemExit(f"Could not place Store CTA on homepage {path}")
                html = html.replace("margin-top:34px;border-top:1px solid transparent", "margin-top:24px;border-top:1px solid transparent", 1)
                html = html.replace(".features{margin-top:22px}", ".features{margin-top:18px}", 1)

              elif path in media_paths:
                # Place between the existing product actions and source tiles.
                marker = '<div class="sources">'
                if marker not in html:
                  raise SystemExit(f"Could not find product source area in {path}")
                html = html.replace(marker, button + "\n" + marker, 1)

              else:
                # Privacy/support: put the Store CTA immediately below the page metadata.
                pattern = re.compile(r'(<div class="meta">.*?</div>)', re.S)
                html, n = pattern.subn(r'\1\n' + button, html, count=1)
                if n != 1:
                  raise SystemExit(f"Could not place Store CTA on utility page {path}")

            path.write_text(html, encoding="utf-8")

          print(f"Updated {len(targets)} pages")
          PY

      - name: Commit rollout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en fa de es it fr pt ja zh hi ru ar privacy support
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Roll out Microsoft Store CTA across all public pages"
          git push origin HEAD:main

name: Security Baseline Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block credentials and dangerous tracked files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          names = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8', 'replace').split('\0')
          secret_re = [
              re.compile(r'-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'),
              re.compile(r'gh' + r'(?:p|o|u|s|r)_[a-zA-Z0-9]{30,}'),
              re.compile(r'github_pat_' + r'[A-Za-z0-9_]{35,}'),
              re.compile(r'AKIA' + r'[0-9A-Z]{16}'),
          ]
          bad_names = re.compile(r'^(?:\.env(?:\..+)?|id_(?:rsa|ed25519|ecdsa)|credentials\.(?:json|ya?ml)|secrets\.(?:json|ya?ml)|terraform\.tfstate(?:\.backup)?|.*\.(?:p12|pfx|pvk|ppk|kdbx))$', re.I)
          findings=[]
          for raw in names:
              if not raw: continue
              p=Path(raw)
              if any(bad_names.fullmatch(part) for part in p.parts):
                  findings.append((raw, 'sensitive filename'))
                  continue
              if p.is_file() and p.stat().st_size <= 512_000 and p.suffix.lower() in {'.py','.js','.mjs','.cjs','.json','.yml','.yaml','.sh','.ps1','.xml','.html','.md','.txt','.toml','.ini','.config','.cs','.xaml','.axaml'}:
                  content=p.read_text(encoding='utf-8', errors='replace')
                  # Do not flag the scanner's own illustrative detection patterns.
                  if raw == '.github/workflows/security-baseline.yml': continue
                  if any(rx.search(content) for rx in secret_re):
                      findings.append((raw, 'possible credential/private key'))
          if findings:
              for path,reason in findings:
                  print(f'::error file={path}::{reason}')
              sys.exit(1)
          print('Security baseline passed: no blocked file names or obvious token/key patterns in tracked text.')
          PY

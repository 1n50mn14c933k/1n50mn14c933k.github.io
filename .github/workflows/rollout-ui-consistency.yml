name: Site-wide UI consistency rollout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rollout:
    if: github.actor != 'github-actions[bot] && contains(github.event.head_commit.message, 'Run site-wide UI consistency rollout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Normalize navigation and Microsoft Store CTA
        run: python3 .github/scripts/rollout-ui-consistency.py
      - name: Commit rollout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Fix Store CTA placement, readability, and site navigation"
          git push

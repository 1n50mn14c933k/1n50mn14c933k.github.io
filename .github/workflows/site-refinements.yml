name: Apply unified KOLFAT visual refinements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run site refinements rollout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply to all sitemap pages and verify metadata
        run: python3 .github/scripts/apply_site_refinements.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Layout: restore fixed-header title clearance across published pages"
            git push origin HEAD:refs/heads/automation/legal-heading-clearance-20261028
          fi

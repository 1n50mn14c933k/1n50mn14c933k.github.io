name: Publish MEDIA KOLFAT 2.0 page information
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Publish MEDIA KOLFAT v2 page updates') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Generate 24 verified localized release summaries
        run: python3 .github/scripts/update_media_kolfat_v2_pages.py
      - name: Commit and publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/Media_Kolfat/index.html' '*/download/index.html' 'download/index.html'\n          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Content: refresh 24 MEDIA KOLFAT product and download pages to v2.0.0"
            git push
          fi

name: KOLFAT Website Content Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/site_content_audit.py'
      - '.github/workflows/site-content-audit.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/site_content_audit.py'
      - '.github/workflows/site-content-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit content and links
        run: python3 .github/scripts/site_content_audit.py | tee website-content-audit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kolfat-website-content-audit
          path: website-content-audit.txt
          retention-days: 14

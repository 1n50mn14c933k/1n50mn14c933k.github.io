name: KOLFAT Website Content Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/site_content_audit.py'
      - '.github/workflows/site-content-audit.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/site_content_audit.py'
      - '.github/workflows/site-content-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit content and links
        run: python3 .github/scripts/site_content_audit.py | tee website-content-audit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kolfat-website-content-audit
          path: website-content-audit.txt
          retention-days: 14

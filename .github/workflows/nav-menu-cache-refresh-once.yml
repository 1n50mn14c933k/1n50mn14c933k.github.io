name: One-time refresh of shared navigation cache
on:
  push:
    branches: [fix/force-refresh-shared-nav-20261108]
    paths:
      - ".github/workflows/nav-menu-cache-refresh-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-all-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Update shared menu JS cache version across localized HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          target = '20261108-remove-duplicate-guides-v3'
          pattern = re.compile(r'(/assets/nav-dropdown\.js\?v=)[^"\x27&<>\s]+')
          modified = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              previous = path.read_text(encoding='utf-8')
              updated, hits = pattern.subn(lambda match: match.group(1) + target, previous)
              if hits and updated != previous:
                  path.write_text(updated, encoding='utf-8')
                  modified.append(str(path))
          print('Updated HTML pages:', len(modified))
          for path in modified:
              print(path)
          if len(modified) < 10:
              raise SystemExit('Expected >10 pages, stopping because the menu reference inventory is unexpected')
          PY
      - name: Commit only changed HTML pages to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "All shared-menu script references were already updated"
          else
            git commit -m "fix(nav): refresh shared menu version on all HTML pages"
            git push origin HEAD:fix/force-refresh-shared-nav-20261108
          fi

name: Publish translated KOLFAT pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  translate:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run multilingual page rollout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate and generate 88 translated pages
        run: python3 .github/scripts/localize_content_pages.py
      - name: Commit translated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "i18n: publish About Download and Guides in 12 languages"
            git push
          fi

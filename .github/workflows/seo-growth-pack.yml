ass="card"><h3>GitHub</h3><p>Public product information, documentation, and project updates.</p><a href="https://github.com/1n50mn14c933k/Media_Kolfat">Visit GitHub →</a></article><article class="card"><h3>Social & video</h3><p>Follow KOLFAT on X, YouTube, and TikTok for demos, announcements, and product updates.</p><p><a href="https://x.com/KOLFAT_APP">X</a> · <a href="https://www.youtube.com/@KOLFAT_APP">YouTube</a> · <a href="https://www.tiktok.com/@kolfat.app">TikTok</a></p></article></div></section></main>{footer()}</body></html>'''

name: KOLFAT SEO growth pack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run SEO growth pack')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply SEO, hierarchy and engagement improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          langs = ["en","fa","de","fr","es","pt","it","ja","zh","hi","ru","ar"]
          same_as = [
              "https://github.com/1n50mn14c933k/Media_Kolfat",
              "https://x.com/KOLFAT_APP",
              "https://www.youtube.com/@KOLFAT_APP",
              "https://www.tiktok.com/@kolfat.app",
          ]
          home_meta = {
              "en":{"title":"KOLFAT — Photo & Video Organization | Order From Chaos","desc":"Organize and preserve photo and video libraries with KOLFAT. Discover MEDIA KOLFAT for Windows, available free from the Microsoft Store.","media":"MEDIA KOLFAT","download":"DOWNLOAD","about":"ABOUT","support":"SUPPORT"},
              "fa":{"title":"KOLFAT — سازمان‌دهی عکس و ویدیو | نظم از دل آشفتگی","desc":"با KOLFAT کتابخانه عکس و ویدیوی خود را مرتب و حفظ کنید. MEDIA KOLFAT برای ویندوز را رایگان از Microsoft Store دریافت کنید.","media":"MEDIA KOLFAT","download":"دانلود","about":"درباره","support":"پشتیبانی"},
              "de":{"title":"KOLFAT — Foto- & Videoorganisation | Ordnung aus dem Chaos","desc":"Organisiere und bewahre Foto- und Videobibliotheken mit KOLFAT. MEDIA KOLFAT für Windows ist kostenlos im Microsoft Store verfügbar.","media":"MEDIA KOLFAT","download":"DOWNLOAD","about":"ÜBER KOLFAT","support":"SUPPORT"},
              "fr":{"title":"KOLFAT — Organisation de photos et vidéos | De l’ordre dans le chaos","desc":"Organisez et préservez vos bibliothèques photo et vidéo avec KOLFAT. MEDIA KOLFAT pour Windows est disponible gratuitement sur le Microsoft Store.","media":"MEDIA KOLFAT","download":"TÉLÉCHARGER","about":"À PROPOS","support":"SUPPORT"},
              "es":{"title":"KOLFAT — Organización de fotos y vídeos | Orden desde el caos","desc":"Organiza y conserva tus bibliotecas de fotos y vídeos con KOLFAT. MEDIA KOLFAT para Windows está disponible gratis en Microsoft Store.","media":"MEDIA KOLFAT","download":"DESCARGAR","about":"ACERCA DE","support":"SOPORTE"},
              "pt":{"title":"KOLFAT — Organização de fotos e vídeos | Ordem no caos","desc":"Organize e preserve bibliotecas de fotos e vídeos com KOLFAT. MEDIA KOLFAT para Windows está disponível gratuitamente na Microsoft Store.","media":"MEDIA KOLFAT","download":"DOWNLOAD","about":"SOBRE","support":"SUPORTE"},
              "it":{"title":"KOLFAT — Organizzazione di foto e video | Ordine dal caos","desc":"Organizza e preserva le tue raccolte di foto e video con KOLFAT. MEDIA KOLFAT per Windows è disponibile gratuitamente nel Microsoft Store.","media":"MEDIA KOLFAT","download":"SCARICA","about":"CHI SIAMO","support":"SUPPORTO"},
              "ja":{"title":"KOLFAT — 写真・動画整理ソフト | 混沌から秩序へ","desc":"KOLFAT で写真や動画のライブラリを整理・保存。Windows 向け MEDIA KOLFAT は Microsoft Store から無料で入手できます。","media":"MEDIA KOLFAT","download":"ダウンロード","about":"KOLFAT について","support":"サポート"},
              "zh":{"title":"KOLFAT — 照片与视频整理软件 | 化混乱为秩序","desc":"使用 KOLFAT 整理并保存照片和视频资料库。Windows 版 MEDIA KOLFAT 可从 Microsoft Store 免费获取。","media":"MEDIA KOLFAT","download":"下载","about":"关于","support":"支持"},
              "hi":{"title":"KOLFAT — फ़ोटो और वीडियो व्यवस्थित करें | अव्यवस्था से व्यवस्था","desc":"KOLFAT के साथ अपनी फ़ोटो और वीडियो लाइब्रेरी को व्यवस्थित और सुरक्षित रखें। Windows के लिए MEDIA KOLFAT Microsoft Store पर निःशुल्क उपलब्ध है।","media":"MEDIA KOLFAT","download":"डाउनलोड","about":"परिचय","support":"सहायता"},
              "ru":{"title":"KOLFAT — Организация фото и видео | Порядок из хаоса","desc":"Организуйте и сохраняйте фото- и видеобиблиотеки с KOLFAT. MEDIA KOLFAT для Windows доступен бесплатно в Microsoft Store.","media":"MEDIA KOLFAT","download":"СКАЧАТЬ","about":"О KOLFAT","support":"ПОДДЕРЖКА"},
              "ar":{"title":"KOLFAT — تنظيم الصور والفيديو | نظام من الفوضى","desc":"نظّم مكتبات الصور والفيديو واحفظها مع KOLFAT. يتوفر MEDIA KOLFAT لنظام Windows مجانًا عبر Microsoft Store.","media":"MEDIA KOLFAT","download":"تنزيل","about":"حول KOLFAT","support":"الدعم"},
          }
          status_text = {
              "en":"Available now","fa":"اکنون در دسترس","de":"Jetzt verfügbar","fr":"Disponible maintenant",
              "es":"Disponible ahora","pt":"Disponível agora","it":"Disponibile ora","ja":"公開中","zh":"现已发布",
              "hi":"अब उपलब्ध","ru":"Уже доступно","ar":"متاح الآن",
          }

          def support_path(lang):
              return "/support/" if lang == "en" else f"/{lang}/support/"

          def replace_meta(text, key, value):
              pattern = rf'(<meta\s+{re.escape(key)}\s+content=")[^"]*(">)'
              return re.sub(pattern, lambda m: m.group(1)+value+m.group(2), text, count=1, flags=re.I)

          changed = []

          # Shared internal-link styles.
          css_path = Path("assets/kolfat-ui-v5.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* KOLFAT SEO INTERNAL LINKS */"
          if marker not in css:
              css += r'''

/* KOLFAT SEO INTERNAL LINKS */
.primary-seo-links,.seo-footer-links{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.primary-seo-links a,.seo-footer-links a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.28);background:rgba(5,5,5,.60);color:#f5f5f2!important;text-decoration:none!important;text-transform:uppercase;letter-spacing:.08em;font-size:.58rem;font-weight:700;white-space:nowrap}
.primary-seo-links a:hover,.seo-footer-links a:hover{background:#fff;color:#050505!important;border-color:#fff}
.hero-foot .primary-seo-links{margin-left:auto;letter-spacing:normal}
.seo-footer-links{margin-left:auto}
@media(max-width:820px){.hero-foot{gap:12px}.primary-seo-links{gap:5px}.primary-seo-links a{min-height:30px;padding:0 7px;font-size:.52rem}.seo-footer-links{margin-top:12px;margin-left:0}}
@media(max-width:640px){.hero-foot{align-items:flex-end}.hero-foot>span{max-width:40%}.primary-seo-links{justify-content:flex-end;max-width:58%}.primary-seo-links a{min-height:28px;padding:0 6px;font-size:.48rem}}
'''
              css_path.write_text(css, encoding="utf-8")
              changed.append(str(css_path))

          # Home pages.
          for lang in langs:
              path = Path(lang) / "index.html"
              text = path.read_text(encoding="utf-8")
              original = text
              m = home_meta[lang]
              text = re.sub(r'<title>.*?</title>', f'<title>{m["title"]}</title>', text, count=1, flags=re.I|re.S)
              text = replace_meta(text, 'name="description"', m["desc"])
              if '<meta name="robots"' not in text:
                  text = re.sub(r'(<meta name="description"[^>]*>)', r'\1\n<meta name="robots" content="index,follow">', text, count=1, flags=re.I)
              text = replace_meta(text, 'property="og:site_name"', "KOLFAT")
              text = replace_meta(text, 'property="og:title"', m["title"])
              text = replace_meta(text, 'property="og:description"', m["desc"])
              text = replace_meta(text, 'name="twitter:title"', m["title"])
              text = replace_meta(text, 'name="twitter:description"', m["desc"])
              schema = {
                  "@context":"https://schema.org",
                  "@graph":[
                      {"@type":"WebSite","@id":"https://kolfat.app/#website","url":"https://kolfat.app/","name":"KOLFAT","alternateName":"Kolfat","inLanguage":"zh-CN" if lang=="zh" else lang},
                      {"@type":"Brand","@id":"https://kolfat.app/#brand","name":"KOLFAT","alternateName":"Kolfat","url":"https://kolfat.app/","sameAs":same_as},
                  ],
              }
              text = re.sub(r'<script type="application/ld\+json">[\s\S]*?</script>',
                            '<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(",",":"))+'</script>',
                            text,count=1,flags=re.I)
              if 'class="primary-seo-links"' not in text:
                  nav = f'<nav class="primary-seo-links" aria-label="Primary"><a href="/{lang}/Media_Kolfat/">{m["media"]}</a><a href="/download/">{m["download"]}</a><a href="/about/">{m["about"]}</a><a href="{support_path(lang)}">{m["support"]}</a></nav>'
                  text = re.sub(r'(<div class="hero-foot">[\s\S]*?<span>[\s\S]*?</span>)(\s*</div>)',
                                lambda x:x.group(1)+nav+x.group(2),text,count=1,flags=re.I)
              text = re.sub(r'/assets/kolfat-ui-v5\.css\?v=[^"\']+', '/assets/kolfat-ui-v5.css?v=20261018-seo1', text, count=1)
              if text != original:
                  path.write_text(text,encoding="utf-8")
                  changed.append(str(path))

          # Product pages.
          for lang in langs:
              path = Path(lang) / "Media_Kolfat" / "index.html"
              text = path.read_text(encoding="utf-8")
              original = text
              canonical = f"https://kolfat.app/{lang}/Media_Kolfat/"
              home_url = f"https://kolfat.app/{lang}/"
              text = re.sub(r'<span class="status">[\s\S]*?</span>',f'<span class="status">{status_text[lang]}</span>',text,count=1,flags=re.I)
              text = re.sub(r'<a class="site-logo" href="/"([^>]*)>',f'<a class="site-logo" href="/{lang}/"\1>',text,count=1,flags=re.I)
              text = replace_meta(text, 'property="og:site_name"', "KOLFAT")
              text = re.sub(r'<a class="btn secondary" href="https://github\.com/1n50mn14c933k">','<a class="btn secondary" href="https://github.com/1n50mn14c933k/Media_Kolfat">',text,count=1,flags=re.I)
              if lang == "en":
                  title = "MEDIA KOLFAT — Free Photo & Video Organizer for Windows"
                  desc = "Organize photos and videos on Windows with MEDIA KOLFAT. Guided copy and advanced move workflows, duplicate finding, library browsing and local processing. Free from Microsoft Store."
                  text = re.sub(r'<title>.*?</title>',f'<title>{title}</title>',text,count=1,flags=re.I|re.S)
                  text = replace_meta(text,'name="description"',desc)
                  text = replace_meta(text,'property="og:title"',title)
                  text = replace_meta(text,'property="og:description"',"Organize photo and video libraries on Windows with guided workflows, duplicate finding, local processing and a clear folder structure.")
                  text = replace_meta(text,'name="twitter:title"',title)
                  text = replace_meta(text,'name="twitter:description"',"Organize photo and video libraries on Windows with guided workflows, duplicate finding and local processing.")
                  text = text.replace(">Follow development</a>",">View MEDIA KOLFAT on GitHub</a>")

              software_desc = ""
              m_script = re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',text,re.I)
              if m_script:
                  try:
                      old = json.loads(m_script.group(1))
                      software_desc = old.get("description","")
                      if not software_desc and isinstance(old.get("@graph"),list):
                          software_desc = old["@graph"][0].get("description","")
                  except Exception:
                      pass
              if not software_desc:
                  software_desc = "MEDIA KOLFAT helps organize photos and videos on Windows."
              graph = {
                  "@context":"https://schema.org",
                  "@graph":[
                      {"@type":"SoftwareApplication","@id":canonical+"#software","name":"MEDIA KOLFAT","url":canonical,"applicationCategory":"MultimediaApplication","operatingSystem":"Windows","description":software_desc,
                       "publisher":{"@type":"Brand","@id":"https://kolfat.app/#brand","name":"KOLFAT","url":"https://kolfat.app/","sameAs":same_as}},
                      {"@type":"BreadcrumbList","@id":canonical+"#breadcrumb","itemListElement":[
                          {"@type":"ListItem","position":1,"name":"KOLFAT","item":home_url},
                          {"@type":"ListItem","position":2,"name":"MEDIA KOLFAT","item":canonical},
                      ]},
                  ],
              }
              text = re.sub(r'<script type="application/ld\+json">[\s\S]*?</script>',
                            '<script type="application/ld+json">'+json.dumps(graph,ensure_ascii=False,separators=(",",":"))+'</script>',
                            text,count=1,flags=re.I)
              if 'class="seo-footer-links"' not in text:
                  m = home_meta[lang]
                  extra = '<a href="/guides/">GUIDES</a>' if lang=="en" else ''
                  nav = f'<nav class="seo-footer-links" aria-label="KOLFAT links"><a href="/{lang}/">KOLFAT</a><a href="/download/">{m["download"]}</a><a href="/about/">{m["about"]}</a><a href="{support_path(lang)}">{m["support"]}</a>{extra}</nav>'
                  text = re.sub(r'(<footer>[\s\S]*?<div class="foot">[\s\S]*?<span>[\s\S]*?</span>)([\s\S]*?</div>\s*</footer>)',
                                lambda x:x.group(1)+nav+x.group(2),text,count=1,flags=re.I)
              text = re.sub(r'/assets/kolfat-ui-v5\.css\?v=[^"\']+', '/assets/kolfat-ui-v5.css?v=20261018-seo1', text, count=1)
              if text != original:
                  path.write_text(text,encoding="utf-8")
                  changed.append(str(path))

          # English support page: remove stale pre-release messaging and add schema/stronger internal links.
          path = Path("support/index.html")
          text = path.read_text(encoding="utf-8")
          original = text
          text = text.replace("As the application approaches version 1.0, additional help content and troubleshooting guidance will be added here.",
                              "MEDIA KOLFAT is available on the Microsoft Store. This support hub will continue to grow with practical help, troubleshooting guidance, and documentation as the app evolves.")
          text = text.replace("Final system requirements for MEDIA KOLFAT 1.0 will be published when the application is ready for release.",
                              "MEDIA KOLFAT is distributed through the Microsoft Store for supported Windows devices. Keep Windows and MEDIA KOLFAT up to date before troubleshooting.")
          text = re.sub(r'Current development is focused on Windows\. Exact supported Windows versions, hardware guidance,\s*storage requirements, and other release requirements will be confirmed before publication\.',
                        "Before large organization jobs, make sure source and destination locations are connected, accessible, and have enough free space for the workflow you choose.",text)
          text = text.replace("Detailed troubleshooting instructions will be added as MEDIA KOLFAT 1.0 is finalized and real support patterns are known.",
                              "For common problems, first confirm the source and destination are accessible, restart the app after Windows or storage changes, and keep the Microsoft Store build up to date.")
          text = re.sub(r'<strong>MEDIA KOLFAT 1\.0:</strong> this support page intentionally avoids fixed troubleshooting procedures\s*and exact system requirements until the first release is finalized\.',
                        "<strong>MEDIA KOLFAT:</strong> install the official Microsoft Store build to receive the supported package and future updates.",text)
          if '"BreadcrumbList"' not in text:
              schema = {"@context":"https://schema.org","@graph":[
                  {"@type":"WebPage","@id":"https://kolfat.app/support/#webpage","url":"https://kolfat.app/support/","name":"MEDIA KOLFAT Support","isPartOf":{"@id":"https://kolfat.app/#website"}},
                  {"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"KOLFAT","item":"https://kolfat.app/en/"},{"@type":"ListItem","position":2,"name":"Support","item":"https://kolfat.app/support/"}]},
              ]}
              text = text.replace("</head>",'<script type="application/ld+json">'+json.dumps(schema,separators=(",",":"))+'</script>\n</head>',1)
          needle='<a class="action" href="/en/Media_Kolfat/">MEDIA KOLFAT Product Page</a>'
          if needle in text and 'href="/download/"' not in text:
              text = text.replace(needle,needle+'\n          <a class="action" href="/download/">Download MEDIA KOLFAT</a>\n          <a class="action" href="/about/">About KOLFAT</a>\n          <a class="action" href="/guides/">Guides</a>',1)
          if text != original:
              path.write_text(text,encoding="utf-8")
              changed.append(str(path))

          # Shared CSS for About, Download, Guides.
          seo_css = r''':root{--bg:#050505;--panel:#0b0b0b;--panel2:#101010;--text:#f5f5f2;--muted:#b9b9b4;--line:rgba(255,255,255,.16);--max:1040px}
          *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.7}a{color:inherit}
          .header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.header-inner{width:min(calc(100% - 40px),var(--max));margin:auto;min-height:74px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;margin-right:auto}.brand img{width:154px;height:auto;display:block}.nav{display:flex;flex-wrap:wrap;gap:8px}.nav a{padding:8px 10px;text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-size:.66rem;font-weight:700;border:1px solid transparent}.nav a:hover,.nav a[aria-current="page"]{border-color:rgba(255,255,255,.35);background:#111}
          main{width:min(calc(100% - 40px),var(--max));margin:auto;padding:72px 0 92px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:.7rem;font-weight:700;color:#ddd}.hero h1{font:400 clamp(3.2rem,7vw,6.4rem)/.95 Georgia,'Times New Roman',serif;letter-spacing:-.045em;margin:14px 0 24px}.lead{max-width:800px;font-size:1.15rem;color:#c7c7c2;margin:0 0 34px}.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:1px solid rgba(255,255,255,.5);text-decoration:none;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;font-weight:700}.cta.primary{background:#fff;color:#050505;border-color:#fff}.cta:hover{background:#fff;color:#050505}
          .section{margin-top:64px;padding-top:42px;border-top:1px solid var(--line)}.section h2{font:400 clamp(2rem,4vw,3.4rem)/1.05 Georgia,'Times New Roman',serif;margin:0 0 18px}.section h3{font-size:1.15rem;margin:28px 0 8px}.section p,.section li{color:var(--muted)}.section ul,.section ol{padding-left:22px}.section li+li{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);margin-top:24px}.card{background:var(--panel);padding:28px}.card h2,.card h3{margin-top:0}.card p{color:var(--muted)}.card a{font-weight:700}
          .breadcrumb{font-size:.74rem;color:#92928d;margin-bottom:30px}.breadcrumb a{color:#c8c8c2}.notice{padding:22px;background:var(--panel2);border:1px solid var(--line);color:#d4d4cf}.store{display:flex;align-items:center;gap:14px;width:min(420px,100%);padding:16px 18px;background:#fff;color:#050505;text-decoration:none;border-radius:10px;font-weight:700}.store svg{width:38px;height:38px;flex:0 0 38px}.store small{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:.62rem}.store strong{display:block;font-size:1.12rem}
          footer{border-top:1px solid var(--line);padding:28px 20px;color:#858580}.foot{width:min(100%,var(--max));margin:auto;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}.foot nav{display:flex;flex-wrap:wrap;gap:12px}.foot a{color:#bdbdb8}
          @media(max-width:720px){.header-inner{padding:12px 0;align-items:flex-start;flex-direction:column}.brand img{width:140px}.nav{gap:4px}.nav a{padding:6px 7px;font-size:.6rem}main{width:calc(100% - 28px);padding:48px 0 70px}.grid{grid-template-columns:1fr}.hero h1{font-size:clamp(2.8rem,14vw,4.7rem)}}'''
          Path("assets/seo-content.css").write_text(seo_css,encoding="utf-8")
          changed.append("assets/seo-content.css")

          def page_head(title, desc, canonical, schema):
              return f'''<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><meta name="description" content="{desc}"><meta name="robots" content="index,follow"><meta name="theme-color" content="#050505"><link rel="canonical" href="{canonical}"><link rel="icon" href="/favicon.png" type="image/png"><meta property="og:type" content="website"><meta property="og:site_name" content="KOLFAT"><meta property="og:title" content="{title}"><meta property="og:description" content="{desc}"><meta property="og:url" content="{canonical}"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="{title}"><meta name="twitter:description" content="{desc}"><script type="application/ld+json">{json.dumps(schema,ensure_ascii=False,separators=(",",":"))}</script><link rel="stylesheet" href="/assets/seo-content.css?v=20261018-seo1">'''

          def header(current):
              def cur(x): return ' aria-current="page"' if current==x else ''
              return f'''<header class="header"><div class="header-inner"><a class="brand" href="/en/" aria-label="KOLFAT home"><img src="/assets/kolfat-logo.webp?v=d2c25ec0" alt="KOLFAT"></a><nav class="nav" aria-label="Primary"><a href="/en/Media_Kolfat/">MEDIA KOLFAT</a><a href="/download/"{cur("download")}>DOWNLOAD</a><a href="/about/"{cur("about")}>ABOUT</a><a href="/guides/"{cur("guides")}>GUIDES</a><a href="/support/"{cur("support")}>SUPPORT</a></nav></div></header>'''

          def footer():
              return '''<footer><div class="foot"><span>© 2026 KOLFAT</span><nav><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/licenses/">Licenses</a><a href="https://x.com/KOLFAT_APP">X</a><a href="https://www.youtube.com/@KOLFAT_APP">YouTube</a></nav></div></footer>'''

          def breadcrumbs(items):
              parts=[]
              for i,item in enumerate(items):
                  if i == len(items)-1: parts.append(item["label"])
                  else: parts.append(f'<a href="{item["href"]}">{item["label"]}</a>')
              return '<div class="breadcrumb">'+' / '.join(parts)+'</div>'

          # About.
          about_url="https://kolfat.app/about/"
          about_schema={"@context":"https://schema.org","@graph":[
              {"@type":"AboutPage","@id":about_url+"#webpage","url":about_url,"name":"About KOLFAT","description":"Learn about KOLFAT, the independent software project behind MEDIA KOLFAT.","isPartOf":{"@id":"https://kolfat.app/#website"}},
              {"@type":"Brand","@id":"https://kolfat.app/#brand","name":"KOLFAT","url":"https://kolfat.app/","sameAs":same_as},
              {"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"KOLFAT","item":"https://kolfat.app/en/"},{"@type":"ListItem","position":2,"name":"About","item":about_url}]},
          ]}

name: Store CTA visibility fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rollout:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run Store CTA v5 rollout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fix Store CTA visibility and localized hero clipping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          langs = ["en","fa","de","es","it","fr","pt","ja","zh","hi","ru","ar"]
          homes = [Path("index.html")] + [Path(l)/"index.html" for l in langs]
          products = [Path(l)/"Media_Kolfat"/"index.html" for l in langs]
          pages = [(p,"home") for p in homes] + [(p,"product") for p in products]

          css = r'''/* KOLFAT STORE / HERO FIX V5 */
          .store-btn,
          .store-btn:link,
          .store-btn:visited,
          .store-btn:hover,
          .store-btn:active{
            display:flex!important;
            align-items:center!important;
            justify-content:flex-start!important;
            gap:16px!important;
            width:350px!important;
            max-width:100%!important;
            min-height:68px!important;
            padding:10px 18px!important;
            border:1px solid #fff!important;
            border-radius:10px!important;
            background:#fff!important;
            background-color:#fff!important;
            color:#050505!important;
            text-decoration:none!important;
            opacity:1!important;
            visibility:visible!important;
            mix-blend-mode:normal!important;
            isolation:isolate!important;
            overflow:visible!important;
            box-shadow:0 10px 30px rgba(0,0,0,.40)!important;
          }
          .store-btn:hover{background:#f4f4f4!important;background-color:#f4f4f4!important;transform:translateY(-1px)!important}
          .store-btn::before,.store-btn::after{display:none!important;content:none!important}
          .store-btn .store-copy,
          .store-btn .store-copy small,
          .store-btn .store-copy strong{color:#050505!important;opacity:1!important;visibility:visible!important;mix-blend-mode:normal!important}
          .store-btn .store-icon{opacity:1!important;visibility:visible!important;filter:none!important;mix-blend-mode:normal!important}
          .store-section{overflow:visible!important}
          .store-section .store-btn{margin-top:0!important}

          html[data-kolfat-page="product"] .hero{
            position:relative!important;
            height:auto!important;
            min-height:0!important;
            overflow:hidden!important;
          }
          html[data-kolfat-page="product"] .hero-bg{
            height:100%!important;
            min-height:100%!important;
          }
          html[data-kolfat-page="product"] .hero-inner{
            position:relative!important;
            width:100%!important;
            height:auto!important;
            min-height:0!important;
            padding:clamp(165px,18vh,190px) 0 90px!important;
          }
          html[data-kolfat-page="product"] .hero-copy{
            position:relative!important;
            top:auto!important;
            left:auto!important;
            right:auto!important;
            width:min(620px,42vw)!important;
            margin:0 0 0 clamp(150px,10vw,205px)!important;
          }
          html[dir="rtl"][data-kolfat-page="product"] .hero-copy{
            margin:0 clamp(150px,10vw,205px) 0 auto!important;
          }
          html[data-kolfat-page="product"] .sources{margin-bottom:0!important}
          html[data-kolfat-page="product"] .sources + .store-btn{margin-top:18px!important;margin-bottom:0!important}

          @media(max-width:980px){
            html[data-kolfat-page="product"] .hero-inner{padding:135px 0 80px!important}
            html[data-kolfat-page="product"] .hero-copy{
              width:min(650px,78vw)!important;
              margin-left:clamp(32px,7vw,72px)!important;
            }
            html[dir="rtl"][data-kolfat-page="product"] .hero-copy{
              margin-left:auto!important;
              margin-right:clamp(32px,7vw,72px)!important;
            }
          }
          @media(max-width:640px){
            .store-btn{width:min(350px,100%)!important;min-height:64px!important;padding:9px 16px!important}
            html[data-kolfat-page="product"] .hero-inner{padding:104px 16px 70px!important}
            html[data-kolfat-page="product"] .hero-copy{
              width:100%!important;
              max-width:none!important;
              margin:0!important;
            }
            html[dir="rtl"][data-kolfat-page="product"] .hero-copy{margin:0!important}
          }
          /* END KOLFAT STORE / HERO FIX V5 */
          '''

          asset = Path('assets/kolfat-ui-v5.css')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_text(css, encoding='utf-8')

          link = '<link rel="stylesheet" href="/assets/kolfat-ui-v5.css?v=20260910-v5">'
          link_re = re.compile(r'\s*<link\s+rel=["\']stylesheet["\']\s+href=["\']/assets/kolfat-ui-v5\.css[^"\']*["\']\s*/?>', re.I)
          html_attr_re = re.compile(r'<html\b([^>]*)>', re.I)

          changed = []
          for path, kind in pages:
            if not path.exists():
              raise RuntimeError(f'Missing expected page: {path}')
            text = path.read_text(encoding='utf-8')
            original = text

            if text.count('class="store-btn"') != 1:
              raise RuntimeError(f'{path}: expected exactly one Store button, found {text.count(chr(99)+"lass=\"store-btn\"")}')

            text = link_re.sub('', text)
            if '</head>' not in text:
              raise RuntimeError(f'{path}: missing </head>')
            text = text.replace('</head>', link + '\n</head>', 1)

            def add_page_attr(m):
              attrs = re.sub(r'\sdata-kolfat-page=["\'][^"\']+["\']', '', m.group(1), flags=re.I)
              return f'<html{attrs} data-kolfat-page="{kind}">'
            text = html_attr_re.sub(add_page_attr, text, count=1)

            if text != original:
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          # Validation across every language.
          for path, kind in pages:
            t = path.read_text(encoding='utf-8')
            assert t.count('/assets/kolfat-ui-v5.css?v=20260910-v5') == 1, path
            assert f'data-kolfat-page="{kind}"' in t, path
            assert t.count('class="store-btn"') == 1, path
          assert 'background:#fff!important' in css
          assert 'height:auto!important' in css
          assert 'min-height:0!important' in css
          print(f'Normalized {len(pages)} pages; changed {len(changed)} HTML files + shared CSS')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kolfat-ui-v5.css index.html */index.html */Media_Kolfat/index.html
          git commit -m "Fix Store CTA visibility across all languages"
          git push

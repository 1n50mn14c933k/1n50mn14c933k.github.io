name: Publish mobile navigation CSS fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run mobile CSS cache rollout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Update shared CSS cache version
        run: python3 .github/scripts/mobile_css_cache_rollout.py
      - name: Commit changed page references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile navigation on localized site pages"
          git push

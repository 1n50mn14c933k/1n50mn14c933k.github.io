name: Catalog Tool Translation Copy
on:
  push:
    branches: [feature/tools-12-language-rollout-20261025]
    paths: ['scripts/audit-tools-i18n.mjs', '.github/workflows/audit-tools-i18n.yml']
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tools-12-language-rollout-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/audit-tools-i18n.mjs
      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TOOLS_ENGLISH_COPY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(i18n): catalog untranslated canonical tool copy"
            git push origin HEAD:feature/tools-12-language-rollout-20261025
          fi

name: Generate Persian KOLFAT Tools
on:
  push:
    branches: [feat/persian-tools-20261025]
    paths:
      - 'scripts/generate-persian-tools.mjs'
      - '.github/workflows/generate-persian-tools.yml'
      - 'tools/assets/i18n-safety-fa.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/persian-tools-20261025
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate Persian pages
        run: node scripts/generate-persian-tools.mjs
      - name: Verify Persian pages, internal assets, privacy and sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          original=list(Path('tools').rglob('index.html'))
          assert len(original)==53,len(original)
          for source in original:
            page=Path('fa')/source
            assert page.exists(),str(page)
            html=page.read_text()
            assert 'lang="fa"' in html and 'dir="rtl"' in html,str(page)
            assert 'src="/tools/assets/i18n.mjs' in html,str(page)
            assert 'href="/fa/tools/assets/' not in html,str(page)
            assert 'src="/fa/tools/assets/' not in html,str(page)
            assert '.kf-i18n-safety' not in html and 'class="kf-i18n-safety"' not in html,str(page)
            assert 'href="/fa/tools/' in html or str(source)=='tools/index.html',str(page)
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[loc.text for loc in ET.parse('sitemap.xml').getroot().findall('.//sm:loc',ns)]
          fa=[url for url in urls if '/fa/tools/' in url]
          assert len(fa)==53,(len(fa),fa)
          assert len(urls)==len(set(urls))
          print('PASS: 53 Persian RTL pages, shared assets and sitemap entries')
          PY
      - name: Commit localized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fa/tools sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "build(fa): publish generated Persian 53-page tools collection"
            git push origin HEAD:feat/persian-tools-20261025
          fi

name: KOLFAT Tools Regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sitemap.xml'
      - '.github/workflows/kolfat-tools-regression.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'sitemap.xml'
      - '.github/workflows/kolfat-tools-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check tools/assets/core.mjs
          node --check tools/assets/app.mjs
          node --check tools/assets/phase2.mjs
          node --check tools/assets/vendor/qrcode.mjs
          node --check tools/assets/code-data-core.mjs
          node --check tools/assets/code-data-advanced.mjs
          node --check tools/assets/code-data-app.mjs
          node --check tools/assets/code-regex-worker.mjs
          node --check tools/assets/networking-address.mjs
          node --check tools/assets/networking-automation.mjs
          node --check tools/assets/networking-app.mjs
      - name: Run core utility tests
        run: node --test tools/tests/*.test.mjs
      - name: Validate public tools in sitemap
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('sitemap.xml')
          root=ET.fromstring(p.read_text())
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[loc.text for loc in root.findall('s:url/s:loc',ns)]
          expected=['https://kolfat.app/tools/','https://kolfat.app/tools/photo-file/']+[f'https://kolfat.app/tools/{slug}/' for slug in ['image-compressor','image-converter','exif-cleaner','photo-date-detective','duplicate-checker','batch-file-renamer','image-watermark','photo-rotator','image-to-pdf','sha256-verifier','qr-code-generator','photo-color-palette']] + ['https://kolfat.app/tools/code-data/'] + [f'https://kolfat.app/tools/code-data/{slug}/' for slug in ['json-formatter','yaml-json-converter','csv-json-converter','xml-formatter','base64-encoder','url-encoder','regex-tester','uuid-generator','html-entity-converter','sql-formatter','markdown-preview','json-schema-validator']]
          expected += ['https://kolfat.app/tools/networking/']+[f'https://kolfat.app/tools/networking/{slug}/' for slug in ['ipv4-subnet-calculator','ipv6-prefix-calculator','vlsm-subnet-planner','ip-range-cidr-converter','vlan-ip-planner','network-port-reference','cron-expression-builder','systemd-timer-builder','unix-timestamp-converter','time-zone-converter','linux-chmod-calculator','docker-compose-checker']]
          assert len(urls)==len(set(urls)),'duplicate URLs'
          for url in expected:
            assert url in urls, url
            page=Path(url.removeprefix('https://kolfat.app/'))/'index.html'
            assert page.is_file(), page
          print('PASS:',len(urls),'sitemap URLs including all KOLFAT Tools category and utility pages')
          PY

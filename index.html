<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kolfat — Order From Chaos</title>
<meta name="description" content="Kolfat turns scattered media into something clear, organized and preserved.">
<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://kolfat.app/">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{
  --bg:#050505;
  --text:#f5f5f2;
  --muted:#b8b8b2;
  --line:rgba(255,255,255,.28);
  --soft:rgba(255,255,255,.06);
  --max:1480px;
}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit}
.site-logo{
  position:fixed;top:20px;left:32px;z-index:9999;display:block;line-height:0
}
.site-logo img{
  display:block;width:180px;height:auto;max-height:42px;object-fit:contain
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:18px;
  min-height:48px;padding:0 28px;border:1px solid rgba(255,255,255,.8);
  border-radius:999px;text-transform:uppercase;letter-spacing:.22em;
  font-size:.72rem;font-weight:700;transition:.22s;background:rgba(0,0,0,.18)
}
.btn:hover{background:#fff;color:#000}
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:#050505
}
.hero-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.72) 24%,rgba(0,0,0,.22) 46%,rgba(0,0,0,.05) 68%,rgba(0,0,0,.12) 100%),
    linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0) 72%,rgba(0,0,0,.34)),
    url('/en/assets/order-from-chaos.png?v=7b773c51fc7c5aa1ccdf531312e23cbd62facf7a');
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  transform:scale(1.002)
}
.hero-bg:before{
  content:"";position:absolute;left:0;top:0;width:38%;height:100%;
  background:linear-gradient(90deg,rgba(5,5,5,.92) 0%,rgba(5,5,5,.56) 58%,transparent 100%);
  pointer-events:none
}
.hero-bg:after{
  content:"";position:absolute;left:0;right:0;top:0;height:90px;
  background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,.12),transparent)
}
.hero-inner{
  position:relative;z-index:3;width:min(calc(100% - 72px),var(--max));margin:auto;padding-top:0;
  display:grid;grid-template-columns:minmax(430px,640px) 1fr;align-items:center
}
.hero-copy{padding:72px 0 34px 20px}
.eyebrow{
  margin:0 0 18px;text-transform:uppercase;letter-spacing:.42em;font-size:.68rem;font-weight:700;color:#ddd
}
h1{
  font-family:Georgia,'Times New Roman',serif;
  font-weight:400;font-size:clamp(4.6rem,7.1vw,8.4rem);
  line-height:.79;letter-spacing:-.055em;margin:0 0 30px;max-width:650px
}
.lead{max-width:510px;font-size:1.25rem;line-height:1.45;color:#d3d3cf;margin:0 0 32px}
.hero .btn{border-radius:0;min-width:228px;justify-content:space-between}
.features{
  display:flex;gap:0;margin-top:34px;border-top:1px solid transparent
}
.feature{
  min-width:150px;padding:0 28px 0 0;margin-right:28px;border-right:1px solid var(--line)
}
.feature:last-child{border-right:0}
.feature strong{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;margin-bottom:4px}
.feature span{color:#b9b9b4;font-size:.68rem}
.hero-foot{
  position:absolute;z-index:4;left:48px;right:48px;bottom:24px;
  display:flex;justify-content:space-between;align-items:center;
  text-transform:uppercase;letter-spacing:.34em;font-size:.54rem;color:#cfcfca
}
.section{
  position:relative;padding:120px 0;border-top:1px solid rgba(255,255,255,.09);
  background:#080808
}
.wrap{width:min(calc(100% - 72px),1260px);margin:auto}
.kicker{text-transform:uppercase;letter-spacing:.34em;font-size:.68rem;color:#a9a9a5}
.section h2{
  font-family:Georgia,'Times New Roman',serif;font-weight:400;
  font-size:clamp(3rem,5.5vw,6rem);line-height:.95;letter-spacing:-.04em;margin:14px 0 24px
}
.section p{color:#aaa;max-width:720px;font-size:1.05rem;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);margin-top:58px}
.card{background:#0a0a0a;padding:38px;min-height:260px}
.num{font-size:.7rem;letter-spacing:.25em;color:#777}
.card h3{font-family:Georgia,serif;font-size:2rem;font-weight:400;margin:42px 0 12px}
.card p{font-size:.92rem;margin:0;color:#8e8e89}
.process{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.steps{border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:80px 1fr;gap:18px;padding:28px 0;border-bottom:1px solid var(--line)}
.step b{font-size:.7rem;letter-spacing:.2em;color:#777}
.step h3{margin:0 0 7px;font-family:Georgia,serif;font-weight:400;font-size:1.7rem}
.step p{margin:0;font-size:.9rem}
.contact-panel{
  border:1px solid var(--line);padding:52px;display:flex;justify-content:space-between;gap:40px;align-items:end
}
.contact-panel .btn{border-radius:0}
footer{padding:34px 0;background:#050505;border-top:1px solid rgba(255,255,255,.08);color:#777;font-size:.75rem}
.footer-inner{width:min(calc(100% - 72px),1260px);margin:auto;display:flex;justify-content:space-between;gap:20px}
@media(max-width:980px){
  .hero-inner{grid-template-columns:1fr}
  .hero-copy{padding-left:0;max-width:650px}
  .hero-bg{background-position:62% center}
  .hero-bg:before{width:70%}
  .grid{grid-template-columns:1fr}
  .process{grid-template-columns:1fr}
}
@media(max-width:640px){
  .site-logo{top:16px;left:16px}
  .site-logo img{width:145px;max-height:36px}
  .hero-inner{width:calc(100% - 32px);padding-top:0}
  .hero-copy{padding-top:120px}
  .hero-bg{background-position:68% center}
  .hero-bg:before{width:100%;background:linear-gradient(90deg,rgba(5,5,5,.98),rgba(5,5,5,.8) 68%,rgba(5,5,5,.28))}
  h1{font-size:clamp(3.5rem,18vw,5rem)}
  .lead{font-size:1rem;max-width:90%}
  .features{flex-direction:column;gap:14px}
  .feature{border-right:0;border-bottom:1px solid var(--line);padding-bottom:12px}
  .hero-foot{left:16px;right:16px;font-size:.45rem;letter-spacing:.2em}
  .wrap{width:calc(100% - 32px)}
  .section{padding:86px 0}
  .contact-panel{padding:28px;display:block}
  .contact-panel .btn{margin-top:24px}
  .footer-inner{width:calc(100% - 32px);display:block}
}
</style>
</head>

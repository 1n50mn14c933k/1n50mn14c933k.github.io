<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kolfat — Order From Chaos</title>
<meta name="description" content="Kolfat turns scattered memories into an organized, preserved media library.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://kolfat.app/en/">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff}
body{font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;color:#d7d7d7;font-size:.74rem;font-weight:700;letter-spacing:.38em}
body.ready .loading{display:none}
.hero{position:relative;width:100%;height:100dvh;min-height:620px;background-color:#050505;background-position:center;background-repeat:no-repeat;background-size:cover;opacity:0;transition:opacity .18s ease}
body.ready .hero{opacity:1}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.03),transparent 34%,transparent 72%,rgba(0,0,0,.04))}
.hit{position:absolute;z-index:5;display:block;overflow:hidden;text-indent:-9999px;white-space:nowrap}
.brand{left:3.2%;top:1.2%;width:14%;height:7%}
.home{left:32.3%;top:1.2%;width:5.2%;height:6%}
.services{left:38.2%;top:1.2%;width:6.6%;height:6%}
.how{left:44.9%;top:1.2%;width:9.2%;height:6%}
.about{left:53.8%;top:1.2%;width:5.3%;height:6%}
.contact{left:59%;top:1.2%;width:6.5%;height:6%}
.cta-top{right:3.6%;top:1.3%;width:12.8%;height:6.2%}
.cta-main{left:5.6%;top:52.2%;width:15.2%;height:7%}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.error{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:24px;background:#000}
body.failed .error{display:grid}
@media(max-aspect-ratio:4/3){.hero{background-position:60% center}}
@media(max-width:760px){.hero{min-height:100dvh;background-position:63% center}.hit{display:none}}
</style>
</head>
<body>
<div class="loading" aria-hidden="true">KOLFAT</div>
<main class="hero" aria-label="Kolfat homepage">
  <a class="hit brand" href="/en/" aria-label="Kolfat home">Kolfat</a>
  <a class="hit home" href="/en/" aria-label="Home">Home</a>
  <a class="hit services" href="/en/Media_Kolfat/" aria-label="Services">Services</a>
  <a class="hit how" href="/en/Media_Kolfat/" aria-label="How it works">How It Works</a>
  <a class="hit about" href="/en/Media_Kolfat/" aria-label="About">About</a>
  <a class="hit contact" href="https://github.com/1n50mn14c933k" aria-label="Contact">Contact</a>
  <a class="hit cta-top" href="/en/Media_Kolfat/" aria-label="Get started">Get Started</a>
  <a class="hit cta-main" href="/en/Media_Kolfat/" aria-label="Get started with Media Kolfat">Get Started</a>
  <h1 class="sr">Kolfat — Order From Chaos</h1>
  <p class="sr">Your memories deserve better. We organize, preserve and bring your media back to life so your memories never fade.</p>
  <div class="error"><div><strong>KOLFAT</strong><br><span>Media that deserves better.</span></div></div>
</main>
<script>
(async()=>{
  try{
    const ids=["00","01","02","03","04"];
    const parts=await Promise.all(ids.map(async id=>{
      const res=await fetch("/en/assets/kolfat-hero/"+id+".txt",{cache:"force-cache"});
      if(!res.ok)throw new Error("asset "+id);
      return (await res.text()).trim();
    }));
    const url='data:image/jpeg;base64,'+parts.join('');
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
    document.querySelector(".hero").style.backgroundImage='url("'+url+'")';
    document.body.classList.add("ready");
  }catch(e){
    document.body.classList.add("ready","failed");
  }
})();
</script>
</body>
</html>
